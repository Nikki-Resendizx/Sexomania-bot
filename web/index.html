<script type="module">
let sec="", todos=[], modalId=null;
const favKey="sexomania_favoritos";
const favoritos=()=>JSON.parse(localStorage.getItem(favKey)||"[]");
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const esActivo=c=>c.activo!==false;
const esNuevo=c=>{if(c.nuevo===true)return true; if(!c.fecha||!c.fecha.toDate)return false; return (Date.now()-c.fecha.toDate().getTime())<604800000;};
const fechaMs=c=>c.fecha&&c.fecha.toDate?c.fecha.toDate().getTime():0;
const etiqueta=c=>c.etiqueta||((c.destacado)?"DESTACADO":"");
window.openSec=s=>{sec=s;document.getElementById("home").style.display="none";document.getElementById("listaPage").style.display="block";document.getElementById("tituloSec").innerText=s;document.getElementById("busqueda").value="";render();};
window.goHome=()=>{document.getElementById("listaPage").style.display="none";document.getElementById("home").style.display="block";};
window.mostrarFavoritos=()=>{sec="__FAVORITOS__";document.getElementById("home").style.display="none";document.getElementById("listaPage").style.display="block";document.getElementById("tituloSec").innerText="⭐ MIS FAVORITOS";document.getElementById("busqueda").value="";render();};
function render(){
  let db=todos.filter(c=>esActivo(c)&&(sec==="__FAVORITOS__"?favoritos().includes(c.id):c.seccion===sec));
  const q=(document.getElementById("busqueda")?.value||"").trim().toLowerCase();
  if(q) db=db.filter(c=>String(c.nombre||"").toLowerCase().includes(q)||String(c.desc||"").toLowerCase().includes(q));
  const orden=document.getElementById("orden")?.value||"popular";
  if(orden==="nombre") db.sort((a,b)=>String(a.nombre||"").localeCompare(String(b.nombre||"")));
  else if(orden==="reciente") db.sort((a,b)=>fechaMs(b)-fechaMs(a));
  else if(orden==="favoritos") db.sort((a,b)=>Number(favoritos().includes(b.id))-Number(favoritos().includes(a.id)));
  else db.sort((a,b)=>Number(b.clicks||0)-Number(a.clicks||0));
  const d=document.getElementById("listaCanales");
  d.innerHTML=db.length?db.map(c=>{const f=favoritos().includes(c.id),b=etiqueta(c)||((esNuevo(c))?"NUEVO":"");return '<button class="item-lista" onclick="ver(\''+c.id+'\')"><span>❥ '+esc(c.nombre)+' '+(c.clicks?'• '+c.clicks+'𓁻':'')+(b?'<span class="badge">'+esc(b)+'</span>':'')+'<small>'+esc(c.seccion)+'</small></span><span onclick="event.stopPropagation();toggleFav(\''+c.id+'\')">'+(f?"⭐":"☆")+'</span></button>';}).join(""):'<p style="color:#ff5555">Aún no hay canales aquí</p>';
}
window.toggleFav=id=>{let f=favoritos();f=f.includes(id)?f.filter(x=>x!==id):f.concat(id);localStorage.setItem(favKey,JSON.stringify(f));render();};
window.ver=async id=>{
  let c=todos.find(x=>x.id===id); if(!c||!esActivo(c))return; modalId=id;
  document.getElementById("fFoto").src=c.foto; document.getElementById("fNombre").innerText=c.nombre;
  document.getElementById("fCategoria").innerText="☛ "+c.seccion+" ☚";
  document.getElementById("fStats").innerText="𓁻 "+(c.clicks||0)+" VISTAS"+(c.destacado?" • 📌 DESTACADO":"");
  document.getElementById("fDesc").innerText=c.desc||"Sin descripción";
  let l=document.getElementById("fLink"); l.href=c.link;
  l.onclick=async()=>{try{await upDoc(docu(db,"chats",id),{clicks:incr(1)})}catch(e){}};
  document.getElementById("modal").style.display="block";
};
window.cerrar=()=>{document.getElementById("modal").style.display="none";modalId=null;};
window.reportar=()=>{let c=todos.find(x=>x.id===modalId);if(c&&c.reporte)window.open(c.reporte,"_blank");else alert("El enlace de reporte no está configurado.");};
onSnapshot(col(db,"chats"),snap=>{
  todos=[];snap.forEach(d=>todos.push({id:d.id,...d.data()}));if(sec)render();
  if(modalId){let actual=todos.find(x=>x.id===modalId);if(actual)document.getElementById("fStats").innerText="𓁻 "+(actual.clicks||0)+" VISTAS"+(actual.destacado?" • 📌 DESTACADO":"");}
});
